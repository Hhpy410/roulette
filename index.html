<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>팀 룰렛 추첨기</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f7f6;
        color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 15px;
      }
      header {
        margin-bottom: 15px;
        text-align: center;
      }
      h1 {
        color: #2c3e50;
        font-size: 1.5rem;
        margin-bottom: 3px;
      }
      header p {
        font-size: 0.9rem;
        color: #666;
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        max-width: 400px;
        width: 100%;
      }
      .roulette-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        background: white;
        padding: 20px;
        border-radius: 16px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        width: 100%;
      }
      /* 룰렛 스타일 */
      .roulette-container {
        position: relative;
        width: 280px;
        height: 280px;
      }
      canvas {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }
      /* 룰렛 화살표 (위쪽 고정) */
      .pointer {
        position: absolute;
        top: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 10px solid transparent;
        border-right: 10px solid transparent;
        border-top: 22px solid #e74c3c;
        z-index: 10;
      }
      .spin-btn {
        margin-top: 15px;
        padding: 12px 0;
        width: 100%;
        font-size: 1.1rem;
        font-weight: bold;
        background-color: #3498db;
        color: white;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(52, 152, 219, 0.4);
        transition:
          background 0.2s,
          transform 0.1s;
      }
      .spin-btn:hover {
        background-color: #2980b9;
      }
      .spin-btn:active {
        transform: scale(0.98);
      }
      .spin-btn:disabled {
        background-color: #bdc3c7;
        cursor: not-allowed;
        box-shadow: none;
      }

      /* 컨트롤(멤버 관리) 섹션 */
      .control-section {
        background: white;
        padding: 20px;
        border-radius: 16px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      .control-section h2 {
        font-size: 1.1rem;
        margin-bottom: 12px;
        color: #34495e;
      }
      .input-group {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }
      input[type="text"] {
        flex: 1;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 1rem;
        outline: none;
      }
      input[type="text"]:focus {
        border-color: #3498db;
      }
      .add-btn {
        padding: 10px 18px;
        background-color: #2ecc71;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        font-size: 1rem;
      }
      .add-btn:hover {
        background-color: #27ae60;
      }
      .member-list {
        list-style: none;
        max-height: 160px;
        overflow-y: auto;
        border: 1px solid #eee;
        border-radius: 8px;
        padding: 5px;
      }
      .member-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 10px;
        border-bottom: 1px solid #f9f9f9;
        font-size: 0.95rem;
      }
      .member-item:last-child {
        border-bottom: none;
      }
      .delete-btn {
        background: none;
        border: none;
        color: #e74c3c;
        cursor: pointer;
        font-weight: bold;
        font-size: 0.85rem;
        padding: 4px 8px;
      }

      /* 당첨 팝업 모달 */
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
        z-index: 100;
        padding: 20px;
      }
      .modal-content {
        background: white;
        padding: 25px;
        border-radius: 16px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        animation: popUp 0.3s ease-out;
        max-width: 280px;
        width: 100%;
      }
      @keyframes popUp {
        0% {
          transform: scale(0.8);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      .modal-content h3 {
        color: #27ae60;
        margin-bottom: 8px;
        font-size: 1.4rem;
      }
      .modal-content p {
        font-size: 1.2rem;
        font-weight: bold;
        color: #2c3e50;
        margin-bottom: 20px;
      }
      .modal-close {
        padding: 10px 0;
        width: 100%;
        background-color: #34495e;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🎯 팀 룰렛 추첨기</h1>
      <p>오늘의 주인공을 뽑아보세요!</p>
    </header>

    <div class="container">
      <!-- 룰렛 영역 -->
      <div class="roulette-section">
        <div class="roulette-container">
          <div class="pointer"></div>
          <canvas id="rouletteCanvas" width="400" height="400"></canvas>
        </div>
        <button id="spinBtn" class="spin-btn" onclick="startRoulette()">
          돌리기!
        </button>
      </div>

      <!-- 멤버 관리 영역 -->
      <div class="control-section">
        <h2>멤버 관리 (총 <span id="memberCount">7</span>명)</h2>
        <div class="input-group">
          <input
            type="text"
            id="newMemberInput"
            placeholder="이름 입력"
            onkeypress="if (event.key === 'Enter') addMember();"
          />
          <button class="add-btn" onclick="addMember()">추가</button>
        </div>
        <ul id="memberList" class="member-list">
          <!-- 자바스크립트로 동적 생성 -->
        </ul>
      </div>
    </div>

    <!-- 당첨 결과 모달 -->
    <div id="resultModal" class="modal">
      <div class="modal-content">
        <h3>🎉 당첨! 🎉</h3>
        <p id="winnerName"></p>
        <button class="modal-close" onclick="closeModal()">확인</button>
      </div>
    </div>

    <script>
      let members = ["국", "렬", "전", "애", "영", "세", "표"];
      let currentAngle = 0; // 현재 회전 각도 (라디안)
      let isSpinning = false;

      const canvas = document.getElementById("rouletteCanvas");
      const ctx = canvas.getContext("2d");
      const colors = [
        "#ff7675",
        "#74b9ff",
        "#55efc4",
        "#ffeaa7",
        "#a29bfe",
        "#fab1a0",
        "#81ecec",
        "#fd79a8",
      ];

      function shuffle(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
          let j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      let shuffledMembers = [...members];

      // 룰렛 그리기 (회전 각도를 반영하여 캔버스 내부에서 직접 그림)
      function drawRoulette(angleOffset = 0) {
        const count = shuffledMembers.length;
        const arc = (2 * Math.PI) / count;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (count === 0) {
          ctx.fillStyle = "#bdc3c7";
          ctx.beginPath();
          ctx.arc(200, 200, 200, 0, 2 * Math.PI);
          ctx.fill();
          ctx.fillStyle = "#fff";
          ctx.font = "bold 20px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("멤버를 추가해주세요", 200, 200);
          return;
        }

        for (let i = 0; i < count; i++) {
          const startAngle = i * arc + angleOffset;
          const endAngle = (i + 1) * arc + angleOffset;

          // 조각 채우기
          ctx.fillStyle = colors[i % colors.length];
          ctx.beginPath();
          ctx.moveTo(200, 200);
          ctx.arc(200, 200, 200, startAngle, endAngle);
          ctx.lineTo(200, 200);
          ctx.fill();

          // 테두리
          ctx.strokeStyle = "#fff";
          ctx.lineWidth = 2;
          ctx.stroke();

          // 텍스트 작성
          ctx.save();
          ctx.translate(200, 200);
          ctx.rotate(startAngle + arc / 2);
          ctx.textAlign = "right";
          ctx.fillStyle = "#2d3436";
          ctx.font = "bold 24px sans-serif";
          ctx.fillText(shuffledMembers[i], 165, 8);
          ctx.restore();
        }
      }

      function updateMemberList() {
        const listEl = document.getElementById("memberList");
        const countEl = document.getElementById("memberCount");
        listEl.innerHTML = "";
        countEl.textContent = members.length;

        members.forEach((member, index) => {
          const li = document.createElement("li");
          li.className = "member-item";
          li.innerHTML = `
                    <span>${member}</span>
                    <button class="delete-btn" onclick="removeMember(${index})">삭제</button>
                `;
          listEl.appendChild(li);
        });
      }

      function addMember() {
        const input = document.getElementById("newMemberInput");
        const name = input.value.trim();
        if (name) {
          members.push(name);
          input.value = "";
          shuffledMembers = shuffle(members);
          currentAngle = 0;
          updateMemberList();
          drawRoulette(currentAngle);
        }
      }

      function removeMember(index) {
        if (members.length <= 1) {
          alert("최소 1명 이상은 있어야 합니다!");
          return;
        }
        members.splice(index, 1);
        shuffledMembers = shuffle(members);
        currentAngle = 0;
        updateMemberList();
        drawRoulette(currentAngle);
      }

      function startRoulette() {
        if (isSpinning || members.length === 0) return;
        isSpinning = true;
        document.getElementById("spinBtn").disabled = true;

        // 돌릴 때마다 멤버 배치 랜덤 섞기
        shuffledMembers = shuffle(members);

        const count = shuffledMembers.length;
        const arc = (2 * Math.PI) / count;

        // 회전 애니메이션 설정 (최소 5바퀴 + 랜덤 각도)
        const extraRotations = Math.PI * 2 * 5;
        const randomExtra = Math.random() * (Math.PI * 2);
        const targetAngle = currentAngle + extraRotations + randomExtra;

        const duration = 4000; // 4초
        const startTime = performance.now();
        const startAngle = currentAngle;

        function animate(currentTime) {
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / duration, 1);

          // easeOutQuart 완화 함수 (부드럽게 멈춤)
          const easeProgress = 1 - Math.pow(1 - progress, 4);

          currentAngle = startAngle + (targetAngle - startAngle) * easeProgress;
          drawRoulette(currentAngle);

          if (progress < 1) {
            requestAnimationFrame(animate);
          } else {
            isSpinning = false;
            document.getElementById("spinBtn").disabled = false;

            // 12시 방향(-90도 또는 3/2 * PI)에 위치한 당첨자 정확히 계산
            const normalizedAngle = currentAngle % (Math.PI * 2);
            // 화살표 위치 기준 역산
            const pointerPos =
              (Math.PI * 1.5 - normalizedAngle + Math.PI * 2) % (Math.PI * 2);
            const winningIndex = Math.floor(pointerPos / arc) % count;
            const winner = shuffledMembers[winningIndex];

            showModal(winner);
          }
        }

        requestAnimationFrame(animate);
      }

      function showModal(winner) {
        document.getElementById("winnerName").textContent =
          `${winner} 님 당첨! 🎊`;
        document.getElementById("resultModal").style.display = "flex";
      }

      function closeModal() {
        document.getElementById("resultModal").style.display = "none";
      }

      updateMemberList();
      drawRoulette(currentAngle);
    </script>
  </body>
</html>
